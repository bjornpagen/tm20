[workspace]
resolver = "3"
members = ["crates/tm20", "crates/tm20-set", "crates/tm20-md", "crates/tm20-cli"]

[workspace.package]
edition = "2024"
license = "0BSD"
repository = "https://github.com/bjornpagen/tm20"
homepage = "https://github.com/bjornpagen/tm20"
authors = ["Bjorn Pagen <11238136+bjornpagen@users.noreply.github.com>"]

[workspace.dependencies]
tm20 = { path = "crates/tm20", version = "0.1.0" }
tm20-set = { path = "crates/tm20-set", version = "0.1.0" }
tm20-md = { path = "crates/tm20-md", version = "0.1.0" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# nightly-2026-08-15: `assert!(xs.is_empty())` is the readable empty check;
# clippy's rewrite (`assert_eq!(xs, [] as [T; 0])`) is worse.
assert_is_empty = "allow"
# Typed Error enums + Display are the contract; a `# Errors` heading on
# every fallible fn would copy that one datum.
missing_errors_doc = "allow"
# `Measure::TAPE` is a const unwrap of a proven nonzero; constructors that
# panic are bugs, not an API contract to document per fn.
missing_panics_doc = "allow"
# ESC/POS and the raster are u8/u16. Truncation is the protocol, not a bug.
cast_possible_truncation = "allow"
# Dots ↔ float in the typesetter; sign and mantissa loss is the raster, not a bug.
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_possible_wrap = "allow"
# `x as f32` is the house spelling for dots-to-float. `f32::from(x)` is longer, not clearer.
cast_lossless = "allow"
# Status bits are independent flags from one printer byte.
struct_excessive_bools = "allow"
# `encode` is one match on Command; CP437 is a mapping table.
too_many_lines = "allow"
# Getters and constructors are used at the call site; decorating every
# `byte()` is not signal.
must_use_candidate = "allow"
# The rhythm table is named by pair; identical `0` / `next` bodies are the point.
match_same_arms = "allow"
# `paint_*` returns `Result` so `paint_one` is one match. The always-Ok
# arms stay in the family.
unnecessary_wraps = "allow"
# Prose names CommonMark, ESC/POS, and command bytes; backticks would shout.
doc_markdown = "allow"
