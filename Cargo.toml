[package]
name = "paper-attention-router"
version = "0.1.0"
edition = "2024"
license = "0BSD"
publish = false

[dependencies]
blake3 = "1.8.7"
bumbledb = { git = "https://github.com/bjornpagen/bumbledb", rev = "13734e2bb61533d529babf11f919316ab112ae0d" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
time = { version = "0.3.55", features = ["parsing"] }
tm20 = { git = "https://github.com/bjornpagen/tm20", rev = "50dc724f1aa0799cee6d42ea20b07d4bee10363e" }
tm20-md = { git = "https://github.com/bjornpagen/tm20", rev = "50dc724f1aa0799cee6d42ea20b07d4bee10363e" }
tm20-set = { git = "https://github.com/bjornpagen/tm20", rev = "50dc724f1aa0799cee6d42ea20b07d4bee10363e" }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
assert_is_empty = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
