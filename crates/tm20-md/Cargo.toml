[package]
name = "tm20-md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "A strict printable CommonMark/GFM subset with source diagnostics for thermal tape"
keywords = ["markdown", "commonmark", "thermal", "printer"]
categories = ["parser-implementations", "text-processing"]

[dependencies]
comrak = { version = "0.54", default-features = false }
tm20-set = { workspace = true }
ratex-parser = "0.1.14"
ratex-layout = "0.1.14"
ratex-render = { version = "0.1.14", features = ["embed-fonts"] }
ratex-types = "0.1.14"
ratex-font = "0.1.14"
ratex-font-loader = { version = "0.1.14", features = ["embed-fonts"] }
ab_glyph = "0.2"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
tm20 = { workspace = true }

[lints]
workspace = true
