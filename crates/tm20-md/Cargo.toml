[package]
name = "tm20-md"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
description = "CommonMark 0.31.2 plus pipe tables and LaTeX math, lowered to a tm20-set Sheet"
keywords = ["markdown", "commonmark", "latex", "typesetting", "thermal"]
categories = ["text-processing"]
exclude = ["tests/corpus", "tests/goldens", "tests/reject"]

[dependencies]
comrak = { version = "0.54", default-features = false }
tm20-set = { workspace = true }
ratex-parser = "0.1.14"
ratex-layout = "0.1.14"
ratex-render = { version = "0.1.14", features = ["embed-fonts"] }
ratex-types = "0.1.14"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
tm20 = { workspace = true }

[lints]
workspace = true
