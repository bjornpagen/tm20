[package]
name = "tm20-set"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "0BSD AND OFL-1.1"
repository.workspace = true
readme.workspace = true
description = "Strict typed layout, embedded fonts, and rasterization for thermal tape"
keywords = ["escpos", "thermal", "typesetting", "printer"]
categories = ["graphics", "text-processing"]

[features]
default = ["portable-fonts"]
portable-fonts = []

[dependencies]
tm20 = { workspace = true }
harfrust = "0.13"
fontdue = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[lints]
workspace = true
